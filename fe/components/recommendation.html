<section id="recommendation" class="content-section">
    <h3>🌱 Gợi ý cây trồng</h3>
    
    <div class="box recommendation-box">
        <div class="map-wrapper">
            <div id="map"></div>
            <div class="map-instruction">📍 Click chọn vị trí để xem dự báo</div>
        </div>

        <div class="result-sidebar">
            <div id="loading" class="state-box" style="display: none;">
                <div class="spinner"></div>
                <p>Đang lấy dữ liệu vệ tinh & dự báo thời tiết...</p>
            </div>

            <div id="result-content" style="display: none;">
                
                <h5 class="section-title">📅 Dự báo 5 ngày tới</h5>
                <div id="weather-grid" class="weather-grid">
                    </div>

                <h5 class="section-title" style="margin-top: 15px;">🌍 Phân tích thổ nhưỡng</h5>
                <div class="env-stats-grid">
                    <div class="stat-card">
                        <span class="icon">📝</span>
                        <div class="info">
                            <label>Đánh giá chung</label>
                            <span id="res-analysis" style="font-size: 0.85em; display:block;">--</span>
                        </div>
                    </div>
                    <div class="stat-card soil">
                        <span class="icon">🌱</span>
                        <div class="info">
                            <label>Loại đất (Dự đoán)</label>
                            <span id="res-soil">--</span>
                        </div>
                    </div>
                </div>

                <h5 class="section-title" style="margin-top: 20px;">💡 Cây trồng phù hợp nhất</h5>
                <div id="crop-list" class="crop-list-container"></div>
            </div>
            
            <div id="placeholder" class="state-box">
                <div class="empty-icon">🗺️</div>
                <p>Chọn vị trí để xem dự báo thời tiết & gợi ý.</p>
            </div>
        </div>
    </div>
</section>
