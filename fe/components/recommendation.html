<section id="recommendation" class="content-section active">
    <h3>🌱 Gợi ý cây trồng (AI Map)</h3>
    
    <div class="box recommendation-box">
        <div class="map-wrapper">
            <div id="map"></div>
            <div class="map-instruction">📍 Click chọn vị trí trên bản đồ</div>
        </div>

        <div class="result-sidebar">
            
            <div id="placeholder" class="state-box">
                <div class="empty-icon">🗺️</div>
                <p>Chưa có dữ liệu phân tích.<br>Vui lòng chọn một điểm trên bản đồ.</p>
            </div>

            <div id="loading" class="state-box" style="display: none;">
                <div class="spinner"></div>
                <p>Gemini đang phân tích vệ tinh & thổ nhưỡng...</p>
            </div>

            <div id="result-content" style="display: none;">
                <h5 class="section-title">🌍 Môi trường tự nhiên</h5>
                <div class="env-stats-grid">
                    <div class="stat-card climate">
                        <span class="icon">🌤</span>
                        <div class="info">
                            <label>Khí hậu</label>
                            <span id="res-climate">--</span>
                        </div>
                    </div>
                    <div class="stat-card temp">
                        <span class="icon">🌡</span>
                        <div class="info">
                            <label>Nhiệt độ</label>
                            <span id="res-temp">--</span>
                        </div>
                    </div>
                    <div class="stat-card soil">
                        <span class="icon">🌱</span>
                        <div class="info">
                            <label>Loại đất</label>
                            <span id="res-soil">--</span>
                        </div>
                    </div>
                </div>

                <h5 class="section-title" style="margin-top: 20px;">💡 Cây trồng tối ưu</h5>
                <div id="crop-list" class="crop-list-container">
                    </div>
            </div>
        </div>
    </div>
</section>
