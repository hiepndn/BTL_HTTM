<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>AgriSmart AI</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    
    <div id="auth-screen" class="auth-container">
        <div class="auth-box">
            <h2 id="auth-title">Đăng nhập Nông Trại</h2>
            <input type="text" id="username" placeholder="Tên đăng nhập">
            <input type="password" id="password" placeholder="Mật khẩu">
            
            <button class="btn-green full-width" onclick="handleAuth()">Đăng nhập</button>
            
            <p class="auth-switch">
                <span id="switch-text">Chưa có tài khoản?</span> 
                <a href="#" onclick="toggleAuthMode()">Đăng ký ngay</a>
            </p>
            <p id="auth-error" style="color:red; display:none;"></p>
        </div>
    </div>

    <div id="main-app" style="display: none; height: 100vh; width: 100%;">
        <div class="sidebar">
            <div class="sidebar-header">
                <h3>GreenFarm AI 🌿</h3>
            </div>
            <div class="menu-item active" data-target="dashboard">📊 Dashboard</div>
            <div class="menu-item" data-target="recommendation">🌱 Gợi ý cây trồng</div>
            <div class="menu-item" data-target="diagnosis">🔍 Chuẩn đoán</div>
            <div class="menu-item" data-target="management">📝 Quản lý mùa vụ</div>
            <div class="menu-item" data-target="youtube">📺 Youtube</div>
            <div class="user-info">
                <small id="user-display">Xin chào!</small>
                <button onclick="logout()" style="font-size:0.8em; background:none; border:none; color:#e74c3c; cursor:pointer;">(Đăng xuất)</button>
            </div>
        </div>

        <div class="main-content" id="content-app">
            </div>
    </div>
    
    <script src="js/main.js"></script>
</body>
</html>
